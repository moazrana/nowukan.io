<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>nowuKan – Coming Soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    color: #fff;
    font-family: 'Poppins', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    /* padding: 40px 20px; */
  }

  .container {
    /* max-width: 820px; */
    width: 100%;
    text-align: center;
  }

  /* Logo */
  .logo {
    width: 100%;
    align-self: stretch;
    height: auto;
    margin-bottom: 60px;
  }

  /* Quote */
  .quote {
    font-weight: 300;
    font-size: clamp(17px, 2.4vw, 24px);
    line-height: 1.6;
    color: #f2f2f2;
    max-width: 700px;
    margin: 0 auto 28px;
  }

  .tagline {
    font-weight: 700;
    font-size: clamp(18px, 2.6vw, 26px);
    margin-bottom: 46px;
  }

  .divider {
    border: none;
    border-top: 1px solid rgba(255, 255, 255, 0.25);
    /* max-width: 820px; */
    margin: 0 auto;
  }

  .coming-soon {
    font-weight: 700;
    font-size: clamp(28px, 4.5vw, 100px);
    letter-spacing: 4px;
    padding: 42px 0;
  }

  .email {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    font-weight: 400;
    font-size: clamp(18px, 2.6vw, 26px);
    padding: 42px 0;
  }

  .email svg { width: 1em; height: 1em; flex-shrink: 0; }

  .email a {
    color: #fff;
    text-decoration: none;
  }

  .email a:hover { text-decoration: underline; }

  .footer {
    font-size: clamp(12px, 1.6vw, 15px);
    letter-spacing: 1.5px;
    color: #cfcfcf;
    text-transform: uppercase;
    padding-top: 28px;
  }
</style>
</head>
<body>
  <img class="logo" src="assets/logo.jpeg" alt="nowuKan – Affordable English. Limitless Opportunities.">
  <div class="container">

    <p class="quote">
      &ldquo;We wanted to make English language acquisition easier,
      more affordable, and more accessible to a global audience&hellip;&rdquo;
    </p>

    <p class="tagline">So, that's exactly what we're doing!</p>

    <hr class="divider">

    <h2 class="coming-soon">COMING SOON</h2>

    <hr class="divider">

    <p class="email">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
        <rect x="2" y="4" width="20" height="16" rx="2"></rect>
        <path d="M2 6l10 7 10-7"></path>
      </svg>
      <a href="mailto:info@nowukan.io">info@nowukan.io</a>
    </p>

    <hr class="divider">

    <p class="footer">&copy; 2026 NOWUKAN.IO &ndash; ALL RIGHTS RESERVED</p>
  </div>
</body>
</html>
